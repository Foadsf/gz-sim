name: Jules on CI failure

# The triggering branch has to be carried in the run's TITLE, because a
# workflow_run listener's own `head_branch` is always the default branch --
# measured 2026-09-07: run 34133053936 dispatched Jules for branch
# windows-test-measurement-5153392590044617919 and was recorded under `main`.
# The retry cap below counts runs by this title; filtering the runs API by
# branch returns 0 forever and silently disables the cap.
run-name: "jules-watch ${{ github.event.workflow_run.head_branch }}"

# Asks Jules to investigate when a CI job this repository can actually
# influence goes red, including on Jules' own PR branches, so that an open PR
# can be driven to a green check instead of stalling on its first failure.
#
# THIS FILE ONLY WORKS ON THE DEFAULT BRANCH. GitHub reads `workflow_run`
# workflows from the default branch and nowhere else, so editing a copy of it
# on a feature branch changes nothing.
#
# THREE THINGS KEEP THIS FROM RUNNING AWAY.
#
#  1. The watched-workflow list below. Bazel CI is deliberately NOT in it:
#     as of 2026-09-07 it fails on upstream gazebosim/gz-sim main too
#     (`no such target '@gz-sensors//:cpu_lidar'`), so nothing in this fork
#     can fix it and every invocation would be wasted. `Ticket opened` and
#     `PR Collection Labeler` are absent for the same reason -- they need
#     gazebosim org secrets a fork cannot have. Both are disabled here
#     anyway. Only add a workflow whose failures are fixable from this
#     repository.
#
#  2. The attempt cap. Jules opens a PR, that PR runs CI, and if it fails the
#     same trigger fires again. The previous version of this guard was a
#     branch allowlist that excluded Jules' own `<name>-<19-digit-session-id>`
#     branches outright, which was loop-safe but also meant Jules never fixed
#     its own PRs -- the thing we actually want. The cap replaces it: count
#     how many times this workflow has already dispatched for this branch and
#     stop at MAX_ATTEMPTS. A wrong fix costs a bounded number of tasks
#     instead of the day's quota.
#
#  3. The open-PR / release-branch requirement. A failure on some abandoned
#     side branch is not worth a task.
#
#  4. Flakes are RE-RUN, not diagnosed. Measured 2026-09-07 on run
#     34140541655: Ubuntu Resolute CI went red on a single timeout,
#     `331 - INTEGRATION_triggered_camera (Timeout)`, with 352 of 353 tests
#     passing, while upstream gazebosim/gz-sim main passed the same day.
#     There was nothing to fix, and a Jules task was spent confirming that.
#     So when the build SUCCEEDED and only the test phase failed, the failed
#     jobs are re-run once first; Jules is called only if it fails again.
#     A compile or configure failure is deterministic and goes straight to
#     Jules without wasting a re-run.

# NOTE on the `KeyError: 'disabled'` traceback from /junit_to_md.py that
# appears in these logs: it is COSMETIC. gazebo-tooling/action-gz-ci runs that
# script as `python3 /junit_to_md.py ... || true`, so it cannot fail the job;
# the exit code comes from `make test`. Do not let a diagnosis treat it as a
# cause. It is a real bug, but it belongs upstream in action-gz-ci.

on:
  workflow_run:
    workflows:
      - "Windows Test CI"
      - "Windows CI"
      - "Ubuntu CI"
      - "Validate package.xml"
    types: [completed]

# One investigation at a time per branch.
concurrency:
  group: jules-ci-failure-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  # write, not read: this workflow re-runs the failed jobs once before
  # spending a Jules task (see point 4 above).
  actions: write
  pull-requests: read

env:
  MAX_ATTEMPTS: 3

jobs:
  investigate:
    name: Ask Jules to investigate
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Collect the failing log
        id: log
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail

          # Jules has NO authenticated GitHub API access. Measured 2026-09-07:
          # session 4335597769314810284 stalled asking a human for the ctest
          # output after 403/404 on the REST API, the gh CLI, the raw log URLs
          # and HTML scraping. So the log has to travel inside the prompt --
          # telling Jules to "read the failed run's logs" cannot work.
          if ! gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/failed.log 2>/dev/null; then
            echo "::warning::Could not download the failed log; dispatching without an excerpt."
            : > /tmp/failed.log
          fi

          # Strip ANSI colour and the "job<TAB>step" columns gh prefixes.
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/^[^\t]*\t[^\t]*\t//' /tmp/failed.log > /tmp/clean.log

          # Anchor on the LAST line that names a failure, and take a window
          # around it. A plain tail does NOT work: the end of a job log is
          # post-job git-credential teardown, so a 200-line tail of the
          # Windows run was almost entirely cleanup noise with the ctest
          # summary barely inside it. Verified on two real logs of different
          # shape -- a ctest run and a Bazel compile failure -- that this
          # window contains the summary line, the failed-test list, and the
          # originating error respectively.
          anchor=$(grep -n -E '##\[error\]|tests passed,|The following tests FAILED|ERROR: |error: |FAILED:' /tmp/clean.log \
            | tail -1 | cut -d: -f1)
          if [ -z "${anchor:-}" ]; then
            tail -n 200 /tmp/clean.log > /tmp/excerpt.txt
          else
            start=$(( anchor - 180 )); [ "$start" -lt 1 ] && start=1
            sed -n "${start},$(( anchor + 15 ))p" /tmp/clean.log > /tmp/excerpt.txt
          fi
          tail -c 12000 /tmp/excerpt.txt > /tmp/excerpt.trim && mv /tmp/excerpt.trim /tmp/excerpt.txt

          if [ ! -s /tmp/excerpt.txt ]; then
            echo "(the log could not be retrieved by the workflow either)" > /tmp/excerpt.txt
          fi
          echo "excerpt: $(wc -l < /tmp/excerpt.txt) lines, $(wc -c < /tmp/excerpt.txt) bytes"

          {
            echo 'excerpt<<JULES_LOG_EOF'
            cat /tmp/excerpt.txt
            echo 'JULES_LOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to dispatch
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # Count previous invocations for this branch BY RUN TITLE (see the
          # run-name comment at the top of this file). Filtering the runs API
          # by branch does not work: a workflow_run listener's own head_branch
          # is always the default branch, so the count would be 0 forever and
          # the cap would never engage.
          #
          # Every successful run of this workflow counts, including ones that
          # declined to dispatch. For the no-open-PR decline that is harmless,
          # because declining is terminal there: no new commit lands, so no
          # new trigger occurs. For the flake re-run below it is NOT terminal,
          # and the consequence is deliberate but worth stating plainly: the
          # re-run consumes one unit of the budget, so a branch that starts
          # with a flake gets MAX_ATTEMPTS-1 real Jules dispatches rather than
          # MAX_ATTEMPTS, and the "Attempt N of M" line in the prompt counts
          # that re-run as attempt 1. Erring toward fewer dispatches is the
          # safe direction; raise MAX_ATTEMPTS if that proves too tight.
          #
          # Limitation, stated rather than hidden: this reads one page of the
          # most recent runs across all branches. If this workflow accumulates
          # more than 100 runs between two failures on the same branch, older
          # entries fall out of the window and the cap under-counts. That errs
          # toward dispatching, so raise per_page if this fork gets that busy.
          #
          # No --paginate here or below: gh applies --jq per page, so an
          # aggregating filter like `| length` would print one number per page
          # and the numeric test below would fail on the multi-line value.
          # The API returns newest first, so one page of 100 is more than
          # enough to find a cap of 3.
          # `set -e` makes a failed query abort the step and dispatch nothing,
          # which is the safe direction: never call Jules on an unknown
          # attempt count. The explicit message is here because the bare gh
          # 404 (e.g. after this file is renamed, so the runs endpoint no
          # longer resolves) is otherwise very hard to read in the log.
          if ! attempts=$(gh api -X GET "repos/$REPO/actions/workflows/jules-ci-failure.yml/runs" \
            -f status=completed -f per_page=100 \
            --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .display_title == \"jules-watch $BRANCH\")] | length"); then
            echo "::error::Could not read this workflow's own run history, so the retry cap cannot be enforced. Refusing to dispatch. If this file was renamed, update the path in the gh api call above."
            exit 1
          fi
          echo "attempts=$attempts (max $MAX_ATTEMPTS)"

          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            echo "::warning::$BRANCH has already had $attempts Jules attempts; not dispatching again. Investigate by hand."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only spend a task on a branch someone is actually waiting on: one
          # with an open PR, or a release branch.
          prs=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f per_page=100 \
            --jq "[.[] | select(.head.ref == \"$BRANCH\")] | length")
          case "$BRANCH" in
            main|gz-sim[0-9]|gz-sim[0-9][0-9]) release_branch=true ;;
            *) release_branch=false ;;
          esac
          echo "open PRs from this branch: $prs; release branch: $release_branch"

          if [ "$prs" -eq 0 ] && [ "$release_branch" = "false" ]; then
            echo "::notice::$BRANCH has no open PR and is not a release branch; not dispatching."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A flake is not worth a Jules task. If the build got as far as
          # running tests -- so this is not a deterministic compile or
          # configure error -- re-run the failed jobs once and stop. If the
          # same failure comes back, the next invocation sees attempts>0 and
          # goes to Jules. Measured on run 34140541655: 352 of 353 tests
          # passed and the only failure was a timeout, while upstream was
          # green; that cost a Jules task for a diagnosis of "flake".
          if [ "$attempts" -eq 0 ] && grep -qE 'tests passed,|\(Timeout\)' /tmp/excerpt.txt; then
            echo "::notice::Test-phase failure and no prior attempt on $BRANCH. Re-running the failed jobs once before spending a Jules task."
            if gh run rerun "$RUN_ID" --repo "$REPO" --failed; then
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Re-run could not be started; falling through to Jules."
          fi

          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "attempt=$((attempts + 1))" >> "$GITHUB_OUTPUT"

      - name: Invoke Jules
        if: steps.guard.outputs.dispatch == 'true'
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          starting_branch: ${{ github.event.workflow_run.head_branch }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Ground rules for this task — follow them exactly:
            1. EVIDENCE. For every factual claim, quote the exact line you relied on with its
               file path and line number, or the log line with its URL. If you cannot find it,
               write NOT FOUND.
            2. MEASURE AND JUDGE SEPARATELY. Report the measured value and your verdict as two
               distinct fields. Never let the verdict stand in for the measurement.
            3. DONE MEANS PROVEN. Do not report done until the CI run you depend on has
               CONCLUDED. Paste real output, not a description of it. Do not end your turn
               while a run you cited is still in progress.
            4. UNCERTAINTY. End with everything you could not verify. An empty list is itself
               a claim.
            5. NO ENVIRONMENT SCRIPTS IN THE DELIVERABLE. Do not commit tooling bootstrap
               files (installers, apt/curl setup scripts). They are not part of the change.

            ## What happened

            A CI workflow failed on this repository.

            - Failed workflow: ${{ github.event.workflow_run.name }}
            - Failed run:      ${{ github.event.workflow_run.html_url }}
            - Branch:          ${{ github.event.workflow_run.head_branch }}
            - Commit:          ${{ github.event.workflow_run.head_sha }}
            - Attempt:         ${{ steps.guard.outputs.attempt }} of ${{ env.MAX_ATTEMPTS }}

            This is attempt ${{ steps.guard.outputs.attempt }}. If earlier attempts on this
            branch already tried a fix, read what they changed before proposing anything, and
            say explicitly why the previous attempt did not work. Repeating a failed fix with
            different wording is not progress. After attempt ${{ env.MAX_ATTEMPTS }} nothing
            further is dispatched automatically, so if you are on the last attempt and are not
            confident, a precise diagnosis is worth far more than another guess.

            ## Verify the file you are about to rely on exists

            A previous Jules task on this repository added a workflow that pointed
            setup-pixi at `.github/ci/windows/pixi.toml` without ever creating that file, and
            every run failed on a missing path before reaching a compiler. Before you finish:
            for each path your change references — manifests, lockfiles, scripts, configs —
            confirm it is present in the branch you are pushing, and quote the directory
            listing that proves it.

            ## The failing log

            You have NO authenticated GitHub API access and cannot fetch this run's logs
            yourself — the REST API, the gh CLI, the raw log URLs and HTML scraping all
            return 403 or 404 for you. Do not spend turns trying. The tail of the failed
            step is reproduced here verbatim:

            ${{ steps.log.outputs.excerpt }}

            If that excerpt is truncated or does not contain the cause, say so and ask for
            the specific part you need. Do not guess at what the missing lines said.

            ## Your environment, and what it means

            You run on Linux. If this is a WINDOWS/MSVC failure you cannot reproduce it
            locally, and you must not pretend otherwise. The only proof available to you is a
            real GitHub Actions run, which happens when you open a PR.

            Because of that, a careful diagnosis is worth more here than a fast patch.

            ## Task

            1. From the log above, identify the failing step and the exact error. If several
               distinct things failed, treat them as separate causes and group them by
               evidence — do not invent one unifying explanation for all of them.
            2. Decide whether it is a genuine regression in this repository, an environment
               problem (a dependency moved, a runner image changed, a flake), or a failure
               inherited from upstream that this fork cannot fix. Say which, with evidence.
               These need different responses and conflating them wastes everyone's time.
               To test the third case, check whether the same job is failing the same way on
               gazebosim/gz-sim, and quote the run you checked.
            3. If, and only if, it is a genuine regression with a clear cause: implement the
               minimal fix on a new branch, open a PR, WAIT for CI to conclude on it, and
               paste the resulting summary line.
            4. If the cause is not clear, or it looks environmental or inherited, DO NOT guess
               at a patch. Open no PR. Report the diagnosis, quote the evidence, and stop. A
               precise "here is what broke and why I cannot fix it blind" is a successful
               outcome.

            Never make CI green by disabling, skipping or excluding a test, and never by
            loosening an assertion until it passes. If the honest answer is that the test now
            fails legitimately, say so and leave it failing.

            ## Reporting

            Report as data, separately from your verdict: the failing step, the verbatim
            error, the test summary line if the tests ran, and whether the cause is a
            regression, environmental, or inherited from upstream. Then list what you could
            not verify.
